<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#16122c" /><title>Buildtopia — World Gate</title><link rel="stylesheet" href="main.css?v=20260830" /></head>
<body class="portal-page"><main class="portal-shell"><section class="portal-card world-gate" aria-labelledby="hub-title"><div class="portal-topline"><span id="welcome-name">Explorer</span><button class="text-button" id="sign-out" type="button">Sign out</button></div><p class="eyebrow">THE WORLD GATE</p><h1 id="hub-title">Choose a world</h1><p class="portal-copy">Enter a world name to visit it. A new name opens a brand-new shared world.</p><form id="world-form" class="portal-form" novalidate><label>World name<input id="world-name" name="world" autocomplete="off" maxlength="28" pattern="[A-Za-z0-9_-]+" placeholder="for example: moon-garden" required /></label><button type="submit">Enter world</button></form><p class="form-note">3–28 letters, numbers, hyphens, or underscores. World names are unique.</p><p id="hub-status" class="status-message" role="status"></p></section></main><script type="module" src="hub.js?v=20260830"></script></body></html>
